name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Hasta que exista el proyecto Maven (issue #1) no hay nada que compilar; la caché
      # de Maven de setup-java además falla si no encuentra un pom.xml.
      - uses: actions/setup-java@v4
        if: hashFiles('pom.xml') != ''
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compilar y correr las pruebas
        if: hashFiles('pom.xml') != ''
        run: |
          chmod +x mvnw
          ./mvnw -B verify
      - name: Sin proyecto Maven todavía
        if: hashFiles('pom.xml') == ''
        run: echo "Todavía no hay pom.xml; se compila cuando entre el esqueleto."
